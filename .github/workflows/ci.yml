name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Commit mesajlarinda otomatik eklenen atif satirlarini yakalar.
  #
  # NEDEN AYRI JOB: kontrol yalnizca git + POSIX araclari kullanir; npm install
  # ya da prisma generate gerektirmez, bu yuzden diger islerin ~100 saniyelik
  # zincirine baglanmasi gereksiz. Ayrica commit araligini gorebilmek icin
  # `fetch-depth: 0` sart; bunu yalnizca bu ise vererek diger uc isin sig
  # klonunu (ve hizini) korumus oluyoruz. Hata durumunda PR kontrol listesinde
  # ayirt edilebilir bir isim gorunur.
  commit-messages:
    runs-on: ubuntu-latest

    # Bu is yalnizca gecmisi okur; baska hicbir yetkiye ihtiyaci yok.
    permissions:
      contents: read

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v7
        with:
          # Commit araligini cozebilmek icin tam gecmis gerekir.
          fetch-depth: 0

      - name: Commit mesajlarini denetle
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; TIP="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; TIP="$PUSH_HEAD"
          fi

          # Yeni bir dal ilk kez itildiginde github.event.before sifirdan olusur;
          # force-push sonrasi ise dusurulmus bir commit'i gosterebilir. Her iki
          # durumda da taban cozulemez, yalnizca tepe commit'i tararız.
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Taban commit cozulemedi ('${BASE}'); yalnizca tepe commit taraniyor."
            if git rev-parse -q --verify "${TIP}^1" >/dev/null 2>&1; then
              BASE="${TIP}^1"
            else
              echo "Tepe commit'in ebeveyni yok (kok commit); tarama atlandi."
              exit 0
            fi
          fi

          echo "Aralik: ${BASE}..${TIP}"

          # KAPSAM NOTU: burada bilincli olarak --range kullaniliyor, --all degil.
          # Gecmiste henuz temizlenmemis ihlalli commit'ler var; --all bu isi
          # ilk calistirmada kirmizi yapar ve sinyali kullanissiz kilar.
          # --range yalnizca YENI commit'leri denetler, yani koruma bugunden
          # itibaren gecerlidir.
          #
          # Gecmis temizligi tamamlandiktan sonra asagidaki satiri
          #   sh scripts/check-commit-messages.sh --all
          # ile degistirin; boylece gecmisin temiz kaldigi da surekli dogrulanir.
          sh scripts/check-commit-messages.sh --range "${BASE}..${TIP}"

  build:
    runs-on: ubuntu-latest

    # Derleme/Prisma icin yer tutucu degiskenler (gercek DB'ye baglanilmaz).
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      AUTH_SECRET: "ci-build-placeholder-secret"

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari yukle
        run: npm install

      - name: Prisma Client uret
        run: npx prisma generate

      - name: Tip kontrolu
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Birim testleri (coverage)
        run: npm run test:coverage

      - name: Coverage'i Codecov'a yukle
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Uretim derlemesi
        run: npm run build

  # Tenant izolasyonunun GERCEKTEN dogrulandigi is. Bu testler yerelde
  # RUN_DB_TESTS ile gatelenir; burada acikca acilir, boylece RLS korumasi her
  # push/PR'da regresyona karsi korunur (yoksa 11 test sessizce skip olurdu).
  #
  # NEDEN AYRI JOB: kendi Postgres'iyle e2e'nin seed verisinden izole calisir ve
  # `build` isinin coverage esiklerine dokunmaz.
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciftlik
          POSTGRES_PASSWORD: ciftlik
          POSTGRES_DB: ciftlik_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ciftlik -d ciftlik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Kurulum/temizlik adimlari sahip (superuser) rolle yapilir; RLS'i bypass
      # eder, testlerin iki tenant'i hazirlayabilmesi icin gereklidir.
      DATABASE_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      DIRECT_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      AUTH_SECRET: "ci-integration-test-secret"
      APP_USER_PASSWORD: "ci_app_pw"

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari yukle
        run: npm install

      - name: Prisma Client uret
        run: npx prisma generate

      - name: Veritabani semasini uygula
        run: npx prisma migrate deploy

      # Migration'lardan SONRA calismali: betik MEVCUT tablolara GRANT verir.
      #
      # URL'in sorgu dizesi kirpilir: `?schema=public` Prisma'ya ozgudur, libpq
      # bunu tanimaz ve "invalid URI query parameter: schema" ile durur.
      - name: Non-superuser uygulama rolunu olustur (ciftlik_app)
        run: |
          psql "${DIRECT_URL%%\?*}" -v ON_ERROR_STOP=1 -v app_pw="$APP_USER_PASSWORD" \
            -f prisma/rls-app-role.sql

      # RLS izolasyonu yalnizca NOSUPERUSER + NOBYPASSRLS rolle anlamlidir;
      # testler bu baglantiyi APP_USER_DATABASE_URL'den alir.
      - name: Entegrasyon testleri (RLS izolasyonu + paylasilan hiz siniri)
        env:
          RUN_DB_TESTS: "1"
          APP_USER_DATABASE_URL: "postgresql://ciftlik_app:ci_app_pw@localhost:5432/ciftlik_test?schema=public"
        run: |
          npx vitest run \
            src/lib/rate-limit.int.test.ts \
            src/lib/tenant-prisma.int.test.ts \
            src/lib/tenant-rls.int.test.ts

  e2e:
    runs-on: ubuntu-latest

    # Uctan uca testler icin gercek bir Postgres ve seed verisi gerekir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciftlik
          POSTGRES_PASSWORD: ciftlik
          POSTGRES_DB: ciftlik_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ciftlik -d ciftlik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      DIRECT_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      AUTH_SECRET: "ci-e2e-test-secret"

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari yukle
        run: npm install

      - name: Prisma Client uret
        run: npx prisma generate

      - name: Veritabani semasini uygula
        run: npx prisma migrate deploy

      - name: Ornek veriyle doldur (seed)
        run: npm run db:seed

      # Vitrin verisi: e2e testlerinin bir kismi demo hesabini (salt-okunurluk)
      # ve magaza katalogunu (sepet -> siparis akisi) kullanir. seed.ts bunlari
      # olusturmaz, bu yuzden demo seed'i de calistiriyoruz.
      - name: Vitrin (demo) verisiyle doldur
        run: npm run db:seed-demo

      - name: Playwright tarayicilarini kur
        run: npx playwright install --with-deps chromium

      - name: Uctan uca testler
        run: npm run test:e2e
