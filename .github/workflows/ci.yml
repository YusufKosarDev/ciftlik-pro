name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Catches the attribution lines that coding assistants append to commit
  # messages.
  #
  # WHY A SEPARATE JOB: the check uses only git and POSIX tools; it needs neither
  # npm install nor prisma generate, so tying it to the other jobs' ~100 second
  # chain would be waste. It also needs `fetch-depth: 0` to resolve the commit
  # range; keeping that here preserves the shallow clone (and the speed) of the
  # other three jobs. On failure it shows up under a distinguishable name in the
  # PR checklist.
  commit-messages:
    runs-on: ubuntu-latest

    # This job only reads history; it needs no other permission.
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history is required to resolve the commit range.
          fetch-depth: 0

      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; TIP="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; TIP="$PUSH_HEAD"
          fi

          # The first push of a new branch makes github.event.before all zeroes;
          # after a force-push it can point at a dropped commit. In both cases the
          # base cannot be resolved, so only the tip commit is scanned.
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Could not resolve the base commit ('${BASE}'); scanning the tip commit only."
            if git rev-parse -q --verify "${TIP}^1" >/dev/null 2>&1; then
              BASE="${TIP}^1"
            else
              echo "The tip commit has no parent (root commit); scan skipped."
              exit 0
            fi
          fi

          echo "Range: ${BASE}..${TIP}"

          # SCOPE NOTE: --range is used here deliberately, not --all. History
          # still holds commits that predate this rule; --all would turn the job
          # red on its first run and make the signal useless. --range checks only
          # NEW commits, so the protection applies from today onward.
          #
          # Once the history has been cleaned up, replace the line below with
          #   sh scripts/check-commit-messages.sh --all
          # so that history staying clean is verified continuously too.
          sh scripts/check-commit-messages.sh --range "${BASE}..${TIP}"

  build:
    runs-on: ubuntu-latest

    # Placeholder variables for the build and for Prisma (no real database is
    # contacted).
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      AUTH_SECRET: "ci-build-placeholder-secret"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Production build
        run: npm run build

  # The job where tenant isolation is ACTUALLY verified. These tests are gated
  # locally behind RUN_DB_TESTS; here the gate is opened explicitly, so the RLS
  # guarantee is protected against regression on every push and PR (otherwise 13
  # tests would silently skip).
  #
  # WHY A SEPARATE JOB: it runs against its own Postgres, isolated from the e2e
  # job's seed data, and does not touch the `build` job's coverage thresholds.
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciftlik
          POSTGRES_PASSWORD: ciftlik
          POSTGRES_DB: ciftlik_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ciftlik -d ciftlik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Setup and teardown run as the owner (superuser) role; it bypasses RLS,
      # which the tests need in order to prepare two tenants.
      DATABASE_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      DIRECT_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      AUTH_SECRET: "ci-integration-test-secret"
      APP_USER_PASSWORD: "ci_app_pw"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply the database schema
        run: npx prisma migrate deploy

      # Must run AFTER the migrations: the script grants on EXISTING tables.
      #
      # The URL's query string is trimmed: `?schema=public` is Prisma-specific,
      # libpq does not recognise it and stops with "invalid URI query parameter:
      # schema".
      - name: Create the non-superuser application role (ciftlik_app)
        run: |
          psql "${DIRECT_URL%%\?*}" -v ON_ERROR_STOP=1 -v app_pw="$APP_USER_PASSWORD" \
            -f prisma/rls-app-role.sql

      # RLS isolation is only meaningful under a NOSUPERUSER + NOBYPASSRLS role;
      # the tests take that connection from APP_USER_DATABASE_URL.
      - name: Integration tests (RLS isolation + shared rate limit)
        env:
          RUN_DB_TESTS: "1"
          APP_USER_DATABASE_URL: "postgresql://ciftlik_app:ci_app_pw@localhost:5432/ciftlik_test?schema=public"
        run: |
          npx vitest run \
            src/lib/rate-limit.int.test.ts \
            src/lib/tenant-prisma.int.test.ts \
            src/lib/tenant-rls.int.test.ts

  e2e:
    runs-on: ubuntu-latest

    # End-to-end tests need a real Postgres and seed data.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciftlik
          POSTGRES_PASSWORD: ciftlik
          POSTGRES_DB: ciftlik_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ciftlik -d ciftlik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      DIRECT_URL: "postgresql://ciftlik:ciftlik@localhost:5432/ciftlik_test?schema=public"
      AUTH_SECRET: "ci-e2e-test-secret"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply the database schema
        run: npx prisma migrate deploy

      - name: Seed sample data
        run: npm run db:seed

      # Showcase data: some e2e tests use the demo account (read-only enforcement)
      # and the storefront catalogue (cart -> order flow). seed.ts does not create
      # those, so the demo seed runs as well.
      - name: Seed the showcase (demo) data
        run: npm run db:seed-demo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
