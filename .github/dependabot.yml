# Dependency updates.
#
# DESIGN: few pull requests, each reviewable. Without grouping this repository
# gets 10+ PRs a week and none of them are read; grouped it gets 1-2. The repo is
# public, so Actions minutes are free — meaning the real cost is not CI, it is
# ATTENTION.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5

    groups:
      # next and eslint-config-next must stay on the SAME version: the second
      # re-exports the first's lint rules, and a version gap produces confusing
      # lint output. react/react-dom have to be validated together with Next as
      # well. All of these are pinned EXACTLY in package.json, so separate PRs
      # would create a temporary mismatch.
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # Everything else in a single PR. This is the setting that actually cuts
      # the noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Majors are handled by hand. An automatic major PR would be `npm audit fix
      # --force` on a schedule: migrating to Next 17 or React 20 is a human
      # decision, and a green CI run is not sufficient evidence.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # next's MINOR is handled by hand too. 16.2 -> 16.3 deprecates the edge
      # runtime (the authorization gate in proxy.ts runs there), moves server
      # rendering to Node streams, and turns Instant Navigation on by default.
      # Those are BEHAVIOUR changes: 304 unit and 33 e2e tests pass on either
      # version, so a green pipeline does NOT measure this risk. The postcss and
      # sharp advisories it closes are unreachable in this project (we author the
      # CSS ourselves; next/image is never used, images.remotePatterns is
      # undefined, and there are no SVGs in public/). The migration will happen on
      # its own branch with a full smoke test — see the closed #53.
      #
      # eslint-config-next re-exports next's lint rules and must stay on the same
      # version; the two are held together.
      - dependency-name: "next"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-minor"]

    commit-message:
      # The repository uses Conventional Commits; this prefix matches both that
      # convention and the commit-msg check (scripts/check-commit-messages.sh).
      #
      # CAREFUL: do NOT write "(deps)" into the prefix. `include: "scope"` already
      # makes Dependabot add the scope, and the two together produce
      # "chore(deps)(deps)" — which is what the first configuration did (see the
      # titles of PR #53/#54). The prefix must be the bare type; Dependabot
      # supplies the scope.
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    labels:
      - "dependencies"

  # The actions used in ci.yml. This also silences the "Node.js 20 is deprecated"
  # warning that showed up in the audit (actions/checkout@v4, actions/setup-node@v4).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    ignore:
      # Action majors are handled by hand as well — the same principle as the npm
      # side. NOTE: the checkout and setup-node v4 -> v7 moves were taken
      # deliberately BEFORE this rule was added (PR #51, #52): they closed the
      # Node 20 deprecation warning, and action majors are not in the same risk
      # class as npm majors — they run on the runner, never enter the production
      # bundle, and a four-job CI shows a break immediately. Even so we do not say
      # "let them come automatically": the decision stays with a human.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    commit-message:
      # Same rule as the npm block: bare type + automatic scope -> "ci(deps):"
      prefix: "ci"
      include: "scope"

    labels:
      - "dependencies"
      - "ci"
